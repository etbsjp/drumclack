[package]
name = "drumclack"
version = "0.1.0"
description = "常駐型タイピングドラム アプリの成立性検証プロトタイプ"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 音声合成・再生。
cpal = "0.15"

# 常駐まわり。どれも通信は行わない（tools/ci/check_no_network_crates.sh が見張る）。
# - single-instance: 二重に起動したら、動いている方の設定の窓を開く。
# - autostart: ログイン時に起動（メニューから切り替える。画面には権限を出さない）。
# - sys-locale: メニューの言語（language = auto）を OS のロケールから決める。
# プラグインは、Tauri 本体（2.11 系）を上げずに済む版に ~ で留めている。
tauri-plugin-single-instance = "~2.4"
tauri-plugin-autostart = "~2.5"
sys-locale = "0.3"

# キー入力の監視は両 OS とも OS の API を直接呼ぶ（src/keyboard.rs の macos_tap / windows_hook）。
# 外部のキー入力クレートは使わない。理由は README を参照。

[profile.release]
panic = "unwind"
