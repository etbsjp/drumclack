[package]
name = "drumclack"
version = "0.1.0"
description = "常駐型タイピングドラム アプリの成立性検証プロトタイプ"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 音声合成・再生。
cpal = "0.15"

# OS全体からのキー入力の「受信専用」フック。
# macOS: CGEventTap を listen-only モードで張る（Accessibility ではなく
#        Input Monitoring 権限のみで動く）。Windows: WH_KEYBOARD_LL による
#        低レベルキーボードフック。選定理由は README を参照。
rdev = "0.5"

[profile.release]
panic = "unwind"
