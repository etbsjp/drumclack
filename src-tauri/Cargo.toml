[package]
name = "drumclack"
version = "0.1.0"
description = "常駐型タイピングドラム アプリの成立性検証プロトタイプ"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 音声合成・再生。
cpal = "0.15"

# キー入力の監視は両 OS とも OS の API を直接呼ぶ（src/keyboard.rs の macos_tap / windows_hook）。
# 外部のキー入力クレートは使わない。理由は README を参照。

[profile.release]
panic = "unwind"
