name: CI

on:
  push:
    branches: [main]
  pull_request:

# checkout・build・test・lint のみを行い、リポジトリへの書き込みは行わないため read 権限のみにする。
permissions:
  contents: read

jobs:
  latency-tests:
    name: tools/latency cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/latency
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build
        run: cargo build --verbose

      - name: cargo test
        run: cargo test --verbose

  # 通信が混ざらないことを固定する検査。依存に通信系・自動更新系のクレートが入ったとき、
  # または CSP が決めた値から変わったときに落とす。
  privacy-guards:
    name: 通信が混ざっていないことの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: shellcheck
        run: shellcheck tools/ci/check_no_network_crates.sh tools/ci/check_csp.sh tools/ci/test_checks.sh

      # 検査が緩んで何でも通すようになっていないこと（悪い入力で exit 1 になること）の確認。
      - name: 検査スクリプトの自己テスト（悪い入力で落ちること）
        run: bash tools/ci/test_checks.sh

      - name: 通信系・自動更新系のクレートが依存に無いこと
        run: bash tools/ci/check_no_network_crates.sh

      - name: tauri.conf.json の CSP が変わっていないこと
        run: bash tools/ci/check_csp.sh

  # 画面（web/）の検査。web/ はビルド工程を持たない素の HTML/JS なので、構文の検査と、
  # 素のブラウザで開いて Rust との橋渡しを差し替える画面のテストで確かめる。
  # 対応表（i18n/*.json）の読み込みは file:// では動かないため、tests/web/serve.js の簡易 HTTP サーバ経由で開く。
  web-tests:
    name: 画面（web/）の構文検査と Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: node --check（web/ と tests/web/ の JavaScript の構文）
        run: |
          set -e
          for file in web/*.js tests/web/*.js; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: 対応表（JSON）が JSON として読めること
        run: |
          set -e
          for file in web/i18n/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done

      - name: 依存のインストール（検査用のみ。web/ には何も足さない）
        working-directory: tests/web
        run: npm ci

      - name: Playwright のブラウザ（Chromium）
        working-directory: tests/web
        run: npx playwright install --with-deps chromium

      - name: 画面のテスト
        working-directory: tests/web
        run: npx playwright test

  resources-scripts-lint:
    name: tools/resources syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (シェルスクリプトの構文チェック)
        run: bash -n tools/resources/record_mac.sh

      - name: shellcheck
        run: shellcheck tools/resources/record_mac.sh

      - name: PowerShell スクリプトの構文チェック
        shell: pwsh
        run: |
          $errorsFound = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/resources/record_windows.ps1", [ref]$tokens, [ref]$errorsFound
          )
          if ($errorsFound.Count -gt 0) {
            $errorsFound | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host "Parse OK"
