name: CI

on:
  push:
    branches: [main]
  pull_request:

# checkout・build・test・lint のみを行い、リポジトリへの書き込みは行わないため read 権限のみにする。
permissions:
  contents: read

jobs:
  latency-tests:
    name: tools/latency cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/latency
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build
        run: cargo build --verbose

      - name: cargo test
        run: cargo test --verbose

  # 通信が混ざらないことを固定する検査。依存に通信系・自動更新系のクレートが入ったとき、
  # または CSP が決めた値から変わったときに落とす。
  privacy-guards:
    name: 通信が混ざっていないことの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: shellcheck
        run: shellcheck tools/ci/check_no_network_crates.sh tools/ci/check_csp.sh

      - name: 通信系・自動更新系のクレートが依存に無いこと
        run: bash tools/ci/check_no_network_crates.sh

      - name: tauri.conf.json の CSP が変わっていないこと
        run: bash tools/ci/check_csp.sh

  resources-scripts-lint:
    name: tools/resources syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (シェルスクリプトの構文チェック)
        run: bash -n tools/resources/record_mac.sh

      - name: shellcheck
        run: shellcheck tools/resources/record_mac.sh

      - name: PowerShell スクリプトの構文チェック
        shell: pwsh
        run: |
          $errorsFound = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/resources/record_windows.ps1", [ref]$tokens, [ref]$errorsFound
          )
          if ($errorsFound.Count -gt 0) {
            $errorsFound | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host "Parse OK"
