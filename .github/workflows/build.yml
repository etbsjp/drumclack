name: Build and test

permissions:
  contents: read

# 常駐型タイピングドラムの成立性検証プロトタイプ。
# macOS / Windows それぞれでビルドとテストを行い、未署名のビルド成果物を
# アーティファクトとしてアップロードする。署名・インストーラー作成は行わない。
#
# CI の起動タイミングについては vk-agents のルール
# （run-ci ラベル付与時と、リリース時のみ）に従う。

on:
  # 運用方針: CI は「人が手動で run-ci ラベルを付けたとき」と「リリース時
  # （v から始まるタグの push）」のみ実行する。PR への push を素通しで
  # 拾うと、エージェントが作った PR でも自動的に CI が走ってしまうため、
  # ラベルの有無を job 側の if 条件で判定する。
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: drumclack
            artifact_path: src-tauri/target/release/drumclack
            artifact_label: drumclack-macos
          - os: windows-latest
            artifact_name: drumclack.exe
            artifact_path: src-tauri/target/release/drumclack.exe
            artifact_label: drumclack-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 注意: Windows ランナーではキー入力フックの実際の動作確認はできない
      # （GUIセッション・権限の都合）。ここではビルドが通ることのみ確認する。
      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      - name: Build release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_label }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
