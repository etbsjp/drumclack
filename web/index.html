<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drumclack</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 文言は i18n/ja.json・en.json にだけ書く。ここには文言を直書きしない。 -->
    <!-- 画面の起動に失敗したときだけ boot.js が出す（対応表に頼れないため、文言は英日の直書き）。 -->
    <p class="startup-error" data-testid="startup-error" role="alert" hidden></p>

    <main class="app" data-testid="app">
      <header class="app-header">
        <h1 data-i18n="app.title"></h1>
      </header>

      <!-- 状態の帯: 正常時は1行、異常時は次の操作つき。直近の発音などは「詳細」に畳む。 -->
      <section
        class="status-band"
        data-testid="status-band"
        data-state="checking"
        data-i18n-attr="aria-label:status.label"
      >
        <ul class="status-issues" data-testid="status-issues" aria-live="polite" aria-atomic="true"></ul>
        <details class="status-details" data-testid="status-details">
          <summary data-i18n="status.details"></summary>
          <dl class="status-detail-list">
            <div class="status-detail-row" data-testid="detail-permission-row" hidden>
              <dt data-i18n="status.details.permission"></dt>
              <dd data-testid="detail-permission"></dd>
            </div>
            <div class="status-detail-row">
              <dt data-i18n="status.details.audio"></dt>
              <dd data-testid="detail-audio"></dd>
            </div>
            <div class="status-detail-row">
              <dt data-i18n="status.details.lastPlay"></dt>
              <dd data-testid="detail-last-play"></dd>
            </div>
            <div class="status-detail-row">
              <dt data-i18n="status.details.voices"></dt>
              <dd data-testid="detail-voices"></dd>
            </div>
          </dl>
        </details>
      </section>

      <p class="test-mode" data-testid="test-mode" hidden></p>

      <!-- 窓を閉じても終了しないことは、OS の通知ではなく、この窓の中の文で伝える。 -->
      <p class="resident-note" data-testid="resident-note" data-i18n="app.resident"></p>

      <!-- 設定の保存・読み込みの通知。どの区画を開いていても見える場所に置く。 -->
      <div class="notices" data-testid="notices">
        <div class="notice notice-warn notice-with-close" data-testid="settings-recovered" role="status" hidden>
          <p class="notice-text" data-testid="settings-recovered-text"></p>
          <button
            type="button"
            class="notice-close"
            data-testid="settings-recovered-dismiss"
            data-i18n="common.close"
          ></button>
        </div>
        <p class="notice notice-error" data-testid="settings-error" role="alert" hidden></p>
      </div>

      <!-- 3つの区画（設定／割り当て／演奏）。 -->
      <div class="tabs" role="tablist" data-i18n-attr="aria-label:nav.label">
        <button
          type="button"
          class="tab"
          role="tab"
          id="tab-settings"
          aria-controls="panel-settings"
          aria-selected="true"
          data-testid="tab-settings"
          data-i18n="nav.settings"
        ></button>
        <button
          type="button"
          class="tab"
          role="tab"
          id="tab-assign"
          aria-controls="panel-assign"
          aria-selected="false"
          tabindex="-1"
          data-testid="tab-assign"
          data-i18n="nav.assign"
        ></button>
        <button
          type="button"
          class="tab"
          role="tab"
          id="tab-play"
          aria-controls="panel-play"
          aria-selected="false"
          tabindex="-1"
          data-testid="tab-play"
          data-i18n="nav.play"
        ></button>
      </div>

      <section
        class="panel"
        role="tabpanel"
        id="panel-settings"
        aria-labelledby="tab-settings"
        data-testid="panel-settings"
      >
        <form class="settings-form" data-testid="settings-form">
          <fieldset class="settings-group">
            <legend data-i18n="settings.group.sound"></legend>

            <div class="field">
              <span class="field-label" data-i18n="settings.enabled"></span>
              <div class="field-control">
                <label class="switch-label">
                  <input type="checkbox" data-testid="setting-enabled" />
                  <span data-i18n="settings.enabled.label"></span>
                </label>
                <p class="field-hint" data-i18n="settings.enabled.hint"></p>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="setting-volume" data-i18n="settings.volume"></label>
              <div class="field-control">
                <div class="slider-row">
                  <input
                    type="range"
                    id="setting-volume"
                    min="0"
                    max="100"
                    step="1"
                    data-testid="setting-volume"
                  />
                  <output class="slider-value" for="setting-volume" data-testid="setting-volume-value"></output>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="setting-dynamics" data-i18n="settings.dynamics"></label>
              <div class="field-control">
                <div class="slider-row">
                  <input
                    type="range"
                    id="setting-dynamics"
                    min="0"
                    max="100"
                    step="1"
                    data-testid="setting-dynamics"
                  />
                  <output class="slider-value" for="setting-dynamics" data-testid="setting-dynamics-value"></output>
                </div>
                <p class="field-hint" data-i18n="settings.dynamics.hint"></p>
              </div>
            </div>
          </fieldset>

          <fieldset class="settings-group">
            <legend data-i18n="settings.group.display"></legend>

            <div class="field">
              <label class="field-label" for="setting-language" data-i18n="settings.language"></label>
              <div class="field-control">
                <select id="setting-language" data-testid="setting-language">
                  <option value="auto" data-i18n="settings.language.auto"></option>
                  <option value="ja" data-i18n="settings.language.ja"></option>
                  <option value="en" data-i18n="settings.language.en"></option>
                </select>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="setting-layout" data-i18n="settings.layout"></label>
              <div class="field-control">
                <select id="setting-layout" data-testid="setting-layout">
                  <option value="auto"></option>
                  <option value="jis" data-i18n="settings.layout.jis"></option>
                  <option value="us" data-i18n="settings.layout.us"></option>
                </select>
                <p class="field-hint" data-i18n="settings.layout.hint"></p>
              </div>
            </div>
          </fieldset>
        </form>
      </section>

      <section
        class="panel"
        role="tabpanel"
        id="panel-assign"
        aria-labelledby="tab-assign"
        data-testid="panel-assign"
        hidden
      >
        <p class="notice notice-error" data-testid="assign-load-error" role="alert" data-i18n="assign.loadFailed" hidden></p>

        <div class="assign" data-testid="assign" hidden>
          <!-- 編集する組・配列・既定に戻す -->
          <div class="assign-toolbar">
            <div class="toolbar-group">
              <span class="toolbar-label" id="assign-set-label" data-i18n="assign.set.label"></span>
              <div class="segmented" role="radiogroup" data-testid="assign-set" aria-labelledby="assign-set-label">
                <button type="button" role="radio" aria-checked="true" data-set="typing" data-testid="assign-set-typing" data-i18n="assign.set.typing"></button>
                <button type="button" role="radio" aria-checked="false" tabindex="-1" data-set="play" data-testid="assign-set-play" data-i18n="assign.set.play"></button>
              </div>
            </div>
            <div class="toolbar-group">
              <span class="toolbar-label" id="assign-layout-label" data-i18n="settings.layout"></span>
              <div class="segmented" role="radiogroup" data-testid="assign-layout" aria-labelledby="assign-layout-label">
                <button type="button" role="radio" aria-checked="false" data-layout="jis" data-testid="assign-layout-jis" data-i18n="settings.layout.jis"></button>
                <button type="button" role="radio" aria-checked="false" tabindex="-1" data-layout="us" data-testid="assign-layout-us" data-i18n="settings.layout.us"></button>
              </div>
            </div>
            <div class="toolbar-group toolbar-reset">
              <button type="button" class="issue-button assign-reset" data-testid="assign-reset" data-i18n="assign.reset"></button>
              <span class="field-hint" data-testid="assign-reset-hint" hidden></span>
            </div>
          </div>

          <!-- 確認と結果の帯。どちらも同じ場所に重ねて、出入りで絵が上下にずれないよう、高さを常に確保する。 -->
          <div class="assign-band">
            <!-- 何も出ていないあいだは、操作の案内を同じ場所に出す。 -->
            <p class="field-hint assign-hint" data-testid="assign-hint" data-i18n="assign.hint"></p>
            <div
              class="assign-confirm"
              role="alertdialog"
              aria-describedby="assign-reset-text"
              data-testid="assign-reset-confirm"
              data-i18n-attr="aria-label:assign.reset"
              hidden
            >
              <p class="assign-confirm-text" id="assign-reset-text" data-testid="assign-reset-text"></p>
              <button type="button" class="issue-button" data-testid="assign-reset-confirm-button" data-i18n="assign.reset"></button>
              <button type="button" class="issue-button" data-testid="assign-reset-cancel" data-i18n="assign.reset.cancel"></button>
            </div>
            <div class="assign-feedback" role="status" data-testid="assign-feedback" data-has-content="false">
              <span data-testid="assign-feedback-text"></span>
              <button type="button" class="issue-button" data-testid="assign-undo" data-i18n="assign.undo" hidden></button>
            </div>
          </div>

          <!-- キーボードの絵。足りない幅はこの枠だけ横にスクロールする。 -->
          <div class="keyboard-scroll" data-testid="keyboard-scroll" role="group" data-i18n-attr="aria-label:assign.keyboard.label">
            <div class="keyboard" data-testid="keyboard"></div>
          </div>

          <h2 class="assign-heading" data-i18n="assign.groups.title"></h2>
          <ul class="group-grid" data-testid="assign-groups"></ul>

          <h2 class="assign-heading" data-testid="assign-overrides-title"></h2>
          <p class="field-hint" data-testid="assign-overrides-none" data-i18n="assign.overrides.none"></p>
          <ul class="override-list" data-testid="assign-overrides"></ul>
        </div>

        <div class="key-menu" role="menu" data-testid="key-menu" hidden></div>
      </section>

      <section
        class="panel"
        role="tabpanel"
        id="panel-play"
        aria-labelledby="tab-play"
        data-testid="panel-play"
        hidden
      >
        <div class="play" data-testid="play">
          <!-- いま演奏用かタイピング用かを常に出す。変わったときだけ読み上げる（1打ごとには読み上げない）。 -->
          <div class="play-status" data-testid="play-status" data-mode="typing" role="status">
            <p class="play-mode" data-testid="play-mode"></p>
            <p class="field-hint play-reason" data-testid="play-reason" hidden></p>
          </div>

          <div class="notice notice-warn play-off" data-testid="play-off" hidden>
            <p class="notice-text" data-i18n="play.off"></p>
            <button type="button" class="issue-button" data-testid="play-turn-on" data-i18n="play.turnOn"></button>
          </div>

          <ul class="pads" data-testid="pads" data-dimmed="false"></ul>
          <p class="field-hint" id="play-hint" data-testid="play-hint"></p>
          <p class="field-hint" id="play-exit" data-testid="play-exit" data-i18n="play.exit"></p>
        </div>
      </section>
    </main>

    <script src="./boot.js"></script>
    <script src="./bridge.js"></script>
    <script src="./i18n.js"></script>
    <script src="./layouts.js"></script>
    <script src="./assign.js"></script>
    <script src="./play.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
